name: CI

# The same gate the release runs, but on branches and pull requests, so a
# problem surfaces before it reaches main and turns into a published release.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # No signing key on a pull request, so this is a debug-signed build. It
      # is here to catch Gradle and plugin breakage, not to produce something
      # installable.
      - run: flutter build apk --debug
