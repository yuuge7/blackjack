name: blackjack
description: Single-player blackjack practice table for Android.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  provider: ^6.1.2
  share_plus: ^13.3.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: BigShoulders
      fonts:
        - asset: assets/fonts/BigShouldersDisplay.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
